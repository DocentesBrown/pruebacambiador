<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIN RECREO — Demo de integración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0e0e0e;
      font-family: 'DM Sans', sans-serif;
      color: #f5f0e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      letter-spacing: 6px;
    }
    h1 span { color: #d4a843; }
    p { color: rgba(245,240,232,0.5); font-size: 14px; letter-spacing: .5px; }

    .open-btn {
      background: #d4a843;
      color: #0e0e0e;
      border: none;
      padding: 14px 36px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: filter .2s;
    }
    .open-btn:hover { filter: brightness(1.1); }

    /* ---- OVERLAY MODAL ---- */
    #srModalOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #srModalOverlay.open { display: flex; }

    .sr-modal-wrapper {
      position: relative;
      width: 100%;
      max-width: 820px;
    }

    .sr-close-btn {
      position: absolute;
      top: -36px;
      right: 0;
      background: none;
      border: none;
      color: rgba(245,240,232,0.6);
      font-size: 14px;
      cursor: pointer;
      letter-spacing: 1px;
      font-family: 'DM Sans', sans-serif;
      transition: color .2s;
    }
    .sr-close-btn:hover { color: #f5f0e8; }

    .sr-modal-wrapper iframe {
      width: 100%;
      height: 700px;
      border: none;
      display: block;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .sr-modal-wrapper iframe { height: 90vh; }
    }
  </style>
</head>
<body>

  <h1>SIN <span>RECREO</span></h1>
  <p>Hacé tu remera única.</p>

  <button class="open-btn" onclick="openPersonalizador()">
    PERSONALIZÁ TU REMERA
  </button>

  <!-- MODAL -->
  <div id="srModalOverlay">
    <div class="sr-modal-wrapper">
      <button class="sr-close-btn" onclick="closePersonalizador()">✕ cerrar</button>
      <iframe id="srIframe" src="" title="Personalizador de remeras SIN RECREO"></iframe>
    </div>
  </div>

  <script>
    function openPersonalizador() {
      const overlay = document.getElementById('srModalOverlay');
      const iframe  = document.getElementById('srIframe');
      // Carga el iframe solo cuando se abre (mejor performance)
      if (!iframe.src || iframe.src === window.location.href) {
        iframe.src = 'personalizador.html';
      }
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closePersonalizador() {
      document.getElementById('srModalOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    // Cerrar con Escape
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closePersonalizador();
    });

    // Cerrar al hacer click fuera del modal
    document.getElementById('srModalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closePersonalizador();
    });

    // Escuchar evento del carrito desde el iframe
    window.addEventListener('srAddToCart', function(e) {
      console.log('Producto agregado al carrito:', e.detail);
      closePersonalizador();
      // Aquí podés actualizar tu UI de carrito, hacer un fetch, etc.
    });
  </script>

</body>
</html>
